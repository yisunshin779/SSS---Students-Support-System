services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sss-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SSS_Strong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  redis:
    image: redis:alpine
    container_name: sss-redis
    ports:
      - "6379:6379"

volumes:
  mssql_data: