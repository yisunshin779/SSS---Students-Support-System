spring.application.name=sss-backend-core
# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SSS_Database;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=SSS_Strong!Passw0rd
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA/Hibernate
# Lệnh 'update' giúp tự động tạo bảng trong CSDL dựa trên code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

sis.base-url=http://sis.hust.edu.vn/api
sis.api-key=${SIS_API_KEY:dev-sis-key}
sis.page-size=500
sis.connect-timeout-ms=5000
sis.read-timeout-ms=30000
app.cors.allowed-origins=http://localhost:5173

# Cấu hình LMS (Pull REST API)
lms.base-url=http://localhost:8080/mock/lms
lms.api-key=${LMS_API_KEY:dev-lms-key}
lms.page-size=200
lms.connect-timeout-ms=5000
lms.read-timeout-ms=30000

# Cấu hình Admission (Pull REST API theo năm)
admission.base-url=http://localhost:8080/mock/admission
admission.api-key=${ADMISSION_API_KEY:dev-admission-key}
admission.page-size=500
admission.connect-timeout-ms=5000
admission.read-timeout-ms=30000

# Cấu hình Internship (Inbound Push từ Doanh nghiệp)
internship.ingest-api-key=${INTERNSHIP_API_KEY:dev-enterprise-key}

app.cors.allowed-origins=http://localhost:5173