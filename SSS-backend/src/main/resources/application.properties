spring.application.name=sss-backend-core
# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SSS_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=SSS_Strong!Passw0rd
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA/Hibernate
# Lệnh 'update' giúp tự động tạo bảng trong CSDL dựa trên code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true