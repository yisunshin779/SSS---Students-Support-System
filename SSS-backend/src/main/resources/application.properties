spring.application.name=sss-backend-core
# Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SSS_Database;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=SSS_Strong!Passw0rd
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình JPA/Hibernate
# Lệnh 'update' giúp tự động tạo bảng trong CSDL dựa trên code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

sis.base-url=http://sis.hust.edu.vn/api
sis.api-key=${SIS_API_KEY}
sis.page-size=500
sis.connect-timeout-ms=5000
sis.read-timeout-ms=30000
app.cors.allowed-origins=http://localhost:5173

# Cấu hình kết nối RabbitMQ (LMS Event-Driven - ADR 02)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=SSS_Strong!Passw0rd
spring.rabbitmq.listener.simple.default-requeue-rejected=false